name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 받기
      uses: actions/checkout@v4

    - name: Java 17 설정
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: gradlew 실행 권한
      run: chmod +x ./gradlew

    - name: APK 빌드
      run: ./gradlew assembleDebug --no-daemon

    - name: APK 업로드
      uses: actions/upload-artifact@v4
      with:
        name: 현장캠-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
